name: lms-converter

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: lms-converter:local
    init: true
    restart: unless-stopped
    user: "10001:10001"
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      LMS_CONVERTER_DATA_DIR: /app/data
      LMS_CONVERTER_ENV: production
      LMS_CONVERTER_AUTH_MODE: proxy
      LMS_CONVERTER_TRUSTED_USER_HEADER: X-Forwarded-User
      LMS_CONVERTER_LOG_LEVEL: INFO
      HOME: /tmp
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.0
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
    volumes:
      - lms-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cli:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile
    image: lms-converter:local
    entrypoint:
      - lms-converter
    command:
      - --help
    user: "10001:10001"
    environment:
      LMS_CONVERTER_DATA_DIR: /app/data
      HOME: /tmp
      LMS_CONVERTER_LOG_LEVEL: INFO
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
    volumes:
      - lms-data:/app/data
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lms-data:
