name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run python scripts/update_golden.py --check
      - name: Validate the certification plan
        run: uv run python scripts/run_lms_certification.py --dry-run
      - run: uv run bandit -c pyproject.toml -r adapters cli core domain persistence
      - run: uv run pip-audit
      - name: Generate SBOM
        run: uv run python scripts/generate_sbom.py --output sbom.json
      - name: Validate SBOM
        run: uv run python scripts/validate_sbom.py sbom.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lms-converter-sbom
          path: sbom.json

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --group dev --extra ui
      - run: uv run pytest --cov --cov-report=term-missing

  package:
    name: Build, install, and smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv build
      - name: Install wheel in a clean environment
        run: |
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl
      - name: Smoke-test the installed CLI
        run: uv run python scripts/ci_smoke.py --cli /tmp/smoke-venv/bin/lms-converter
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lms-converter-dist
          path: dist/*

  container:
    name: Build and smoke-test container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build hardened image
        run: docker build --pull --tag lms-converter:ci .
      - name: Verify the image runs as non-root
        run: test "$(docker run --rm --entrypoint id lms-converter:ci -u)" = "10001"
      - name: Smoke-test the CLI in the container
        run: |
          docker run --rm \
            -v "$PWD/scripts/ci_smoke.py:/tmp/ci_smoke.py:ro" \
            lms-converter:ci \
            python /tmp/ci_smoke.py --cli /usr/local/bin/lms-converter
      - name: Smoke-test the web health endpoint
        run: |
          set -euo pipefail
          container_id=$(docker run -d --rm \
            -e LMS_CONVERTER_ENV=development \
            -e LMS_CONVERTER_AUTH_MODE=none \
            -p 127.0.0.1:8501:8501 \
            lms-converter:ci)
          trap 'docker stop "$container_id" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$container_id"
          exit 1
