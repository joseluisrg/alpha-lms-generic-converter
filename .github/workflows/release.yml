name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v0.1.0"
        required: true
      dry_run:
        description: "Build and validate without creating a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Resolve release tag
        id: tag
        run: echo "value=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Verify the tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - run: uv sync --frozen --group dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest --no-cov
      - name: Validate release metadata
        run: |
          uv run python scripts/check_release.py \
            --tag "${{ steps.tag.outputs.value }}" \
            --notes-out release-notes.md
      - run: uv build
      - name: Verify build artifacts
        run: |
          set -euo pipefail
          version=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test -f "dist/lms_converter-${version}-py3-none-any.whl"
          test -f "dist/lms_converter-${version}.tar.gz"
      - name: Install wheel in a clean environment
        run: |
          uv venv /tmp/release-venv
          uv pip install --python /tmp/release-venv/bin/python dist/*.whl
      - name: Smoke-test the installed CLI
        run: uv run python scripts/ci_smoke.py --cli /tmp/release-venv/bin/lms-converter
      - name: Generate SBOM
        run: uv run python scripts/generate_sbom.py --output dist/sbom.json
      - name: Verify SBOM
        run: uv run python scripts/validate_sbom.py dist/sbom.json
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build release container
        run: docker build --pull --tag "lms-converter:${{ steps.tag.outputs.value }}" .
      - name: Verify release container runs as non-root
        run: test "$(docker run --rm --entrypoint id lms-converter:${{ steps.tag.outputs.value }} -u)" = "10001"
      - name: Generate checksums
        run: sha256sum dist/*.whl dist/*.tar.gz dist/sbom.json > dist/SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lms-converter-${{ steps.tag.outputs.value }}
          path: dist/*
      - name: Create GitHub Release
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.value }}"
          args=(release create "$tag" dist/*.whl dist/*.tar.gz dist/SHA256SUMS dist/sbom.json
                --title "lms-converter $tag" --notes-file release-notes.md --verify-tag)
          if [[ "$tag" =~ [0-9](a|b|rc|dev)[0-9]*$ ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
